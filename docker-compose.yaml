version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: filesystem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d filesystem_db" ]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Note: Host is 'db', matching the Postgres service name above
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/filesystem_db
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app  # Enables live code reload in development
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload  # Enables hot reload

  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app  # Enables live code reload
      - /app/node_modules

volumes:
  postgres_data: